name: aantekening
description: The aantekening note-taking application.
publish_to: none
version: 0.1.0+1

resolution: workspace

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  aantekening_core: ^0.1.0
  aantekening_store: ^0.1.0
  aantekening_canvas: ^0.1.0
  aantekening_math: ^0.1.0
  aantekening_ai: ^0.1.0
  aantekening_spell: ^0.1.0
  crypto: ^3.0.7
  http: ^1.6.0
  flutter_riverpod: ^3.4.3
  path_provider: ^2.1.6
  path: ^1.9.1
  pdfrx: ^2.6.1
  file_selector: ^1.1.0
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.2
  markdown: ^7.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_math_fork: ^0.7.4

flutter:
  uses-material-design: true
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: fonts/IBMPlexSans-Regular.ttf
        - asset: fonts/IBMPlexSans-Italic.ttf
          style: italic
        - asset: fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: fonts/IBMPlexMono-Regular.ttf
        - asset: fonts/IBMPlexMono-Italic.ttf
          style: italic
        - asset: fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: fonts/IBMPlexMono-Bold.ttf
          weight: 700
  assets:
    - fonts/OFL.txt
