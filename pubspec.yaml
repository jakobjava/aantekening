name: aantekening_workspace
description: Monorepo root for the aantekening note-taking application.
publish_to: none

environment:
  sdk: ^3.9.0

workspace:
  - app/aantekening
  - packages/aantekening_ai
  - packages/aantekening_canvas
  - packages/aantekening_core
  - packages/aantekening_interchange
  - packages/aantekening_math
  - packages/aantekening_spell
  - packages/aantekening_store

# The typesetter, with fixes its latest release lacks: see its README.
dependency_overrides:
  flutter_math_fork:
    path: third_party/flutter_math_fork

dev_dependencies:
  flutter_lints: ^6.0.0
  lints: ^6.0.0
  test: ^1.25.0
